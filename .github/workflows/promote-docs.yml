name: Promote Docs

on:
  repository_dispatch:
    types: [promote-docs]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote-docs:
    name: Promote snapshot docs to release
    runs-on: ubuntu-latest
    if: >
      github.repository_owner == 'HDCharts' &&
      github.event.client_payload.source_repository == 'HDCharts/charts'
    steps:
      - name: Checkout charts-docs
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Promote snapshot content and update registry
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.release_version }}
        run: |
          set -euo pipefail
          bash scripts/promote-snapshot-to-release.sh "${RELEASE_VERSION}"

      - name: Validate docs release link contract
        shell: bash
        run: bash scripts/test-docs-release-links-contract.sh

      - name: Create promotion pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
          branch: chore/promote-docs-${{ github.event.client_payload.release_version }}
          delete-branch: true
          commit-message: "chore(docs): promote snapshot to ${{ github.event.client_payload.release_version }}"
          title: "chore(docs): promote snapshot to ${{ github.event.client_payload.release_version }}"
          add-paths: |
            content
            registry
          body: |
            Promotes `content/snapshot` to `content/${{ github.event.client_payload.release_version }}` and updates `registry/versions.json`.

            Source context:
            - source_repository: `${{ github.event.client_payload.source_repository }}`
            - source_sha: `${{ github.event.client_payload.source_sha }}`
            - source_run_url: `${{ github.event.client_payload.source_run_url }}`
          labels: |
            docs
            automation
