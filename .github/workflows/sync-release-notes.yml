# Workflow: mirror release notes from charts into charts-docs.
# It is triggered by a repository dispatch from the charts repo.
#
# This keeps the docs repo aligned with the source release notes.
name: Sync Release Notes
on:
  repository_dispatch:
    types: [sync-release-notes]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-release-notes
  cancel-in-progress: true

jobs:
  sync-release-notes:
    name: Mirror charts release notes
    runs-on: ubuntu-latest
    if: >
      github.repository_owner == 'HDCharts' &&
      github.event.client_payload.source_repository == 'HDCharts/charts'
    steps:
      - name: Checkout charts-docs
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate sync inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.release_version }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_version must be SemVer, got: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          if [[ ! "${SOURCE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_ref must be a full charts commit SHA, got: ${SOURCE_REF}" >&2
            exit 1
          fi

      - name: Validate workflow token
        shell: bash
        env:
          CHARTS_WORKFLOW_TOKEN: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CHARTS_WORKFLOW_TOKEN:-}" ]]; then
            echo "Missing required secret: CHARTS_WORKFLOW_TOKEN." >&2
            exit 1
          fi

      - name: Checkout charts release-note source
        uses: actions/checkout@v7
        with:
          repository: HDCharts/charts
          ref: ${{ github.event.client_payload.source_ref }}
          path: .charts-release-notes-source
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}

      - name: Mirror versioned release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.release_version }}
        run: |
          set -euo pipefail
          printf '/.charts-release-notes-source/\n' >> .git/info/exclude

          source_dir=".charts-release-notes-source/release-notes/${RELEASE_VERSION}"
          target_dir="release-notes/${RELEASE_VERSION}"

          if [[ ! -d "${source_dir}" ]]; then
            echo "Missing charts release-note directory: ${source_dir}" >&2
            exit 1
          fi
          if find "${source_dir}" -type l -print -quit | grep -q .; then
            echo "Release-note sources must not contain symbolic links." >&2
            exit 1
          fi

          mkdir -p "${target_dir}"
          rsync --archive --delete "${source_dir}/" "${target_dir}/"
          printf '%s\n' "${RELEASE_VERSION}" > release-notes/current-version.txt

      - name: Validate docs release link contract
        shell: bash
        run: bash scripts/test-docs-release-links-contract.sh

      - name: Create release-note sync pull request
        id: sync_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
          branch: chore/sync-release-notes
          delete-branch: true
          commit-message: "docs(snapshot): sync charts release notes"
          title: "docs(snapshot): sync charts release notes"
          add-paths: |
            release-notes
          body: |
            Mirrors versioned changesets and migration fragments from the charts repository.

            Source:
            - release: `${{ github.event.client_payload.release_version }}`
            - charts commit: `${{ github.event.client_payload.source_ref }}`
            - workflow run: ${{ github.event.client_payload.source_run_url }}
          labels: |
            docs
            automation

      - name: Publish sync summary
        if: always()
        shell: bash
        env:
          PR_URL: ${{ steps.sync_pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.sync_pr.outputs.pull-request-operation }}
        run: |
          {
            echo "## Release-note synchronization"
            echo "- release: \`${{ github.event.client_payload.release_version }}\`"
            echo "- charts source: \`${{ github.event.client_payload.source_ref }}\`"
            if [[ -n "${PR_URL}" ]]; then
              echo "- pull request: ${PR_URL}"
            else
              echo "- pull request operation: ${PR_OPERATION:-none}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
